<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- The compact cut of the mark in src/components/brand/PitchStudyMark.tsx:
       ring, halfway seam, centre circle, penalty areas. A favicon renders at
       16-32px, where the six-yard boxes, penalty arcs and spots stop being
       shapes and just silt up the penalty areas. Strokes are heavier here than
       the component's display weight for the same reason. -->
  <defs>
    <linearGradient id="ps-icon-gradient" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1435f2" />
      <stop offset="52%" stop-color="#1b74ff" />
      <stop offset="100%" stop-color="#35cdff" />
    </linearGradient>
    <clipPath id="ps-icon-clip">
      <circle cx="50" cy="50" r="42.2" />
    </clipPath>
  </defs>

  <g stroke="url(#ps-icon-gradient)" stroke-width="3.6" stroke-linecap="butt">
    <path d="M48.4 6.03A44 44 0 0 0 48.4 93.97" />
    <path d="M51.6 6.03A44 44 0 0 1 51.6 93.97" />
    <path d="M50 6V94" />
    <circle cx="50" cy="50" r="13.6" />

    <g clip-path="url(#ps-icon-clip)">
      <path d="M9.2 32.4H24.5V67.6H9.2Z" />
      <path d="M90.8 32.4H75.5V67.6H90.8Z" />
    </g>
  </g>
</svg>
